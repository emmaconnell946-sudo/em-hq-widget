<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em HQ</title>

<style>
:root {
  --claret: #6b2035;
  --cream: #f8efe2;
  --muted: #e8d4c6;
  --line: rgba(248,239,226,.20);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--cream);
}

.widget {
  width: 100%;
  background: var(--claret);
  border-radius: 14px;
  padding: 22px 28px 18px;
}

/* ───── TOP ROW ───── */

.top {
  display: grid;
  grid-template-columns: minmax(300px, 1.5fr) 1fr 1fr;
  gap: 30px;
  align-items: center;
}

.date {
  font-size: clamp(25px, 3vw, 37px);
  line-height: 1.05;
  letter-spacing: -0.025em;
}

.weather {
  min-width: 0;
}

.label {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.weather-primary {
  display: flex;
  align-items: baseline;
  gap: 7px;
  white-space: nowrap;
}

.weather-icon {
  font-size: 19px;
}

.temp {
  font-size: 25px;
}

.range {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  color: var(--muted);
}

.weather-meta {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
  white-space: nowrap;
}

/* ───── CALENDAR ───── */

.divider {
  height: 1px;
  background: var(--line);
  margin: 17px 0 13px;
}

.calendar-label {
  margin-bottom: 7px;
}

.events {
  display: grid;
  gap: 4px;
}

.event {
  display: grid;
  grid-template-columns: 75px 1fr;
  align-items: baseline;
  min-height: 19px;
}

.event-time {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  color: var(--muted);
}

.event-name {
  font-size: 14px;
}

.empty {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

/* ───── EXAMS ───── */

.exams {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 38px;
}

.exam {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 15px;
}

.exam-name {
  font-size: 14px;
}

.countdown {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}

/* ───── MOBILE ───── */

@media (max-width: 650px) {
  .widget {
    padding: 20px;
  }

  .top {
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }

  .date {
    grid-column: 1 / -1;
  }

  .exams {
    grid-template-columns: 1fr;
    gap: 7px;
  }
}
</style>
</head>

<body>

<div class="widget">

  <div class="top">

    <div class="date" id="date"></div>

    <div class="weather">
      <div class="label">Today</div>

      <div class="weather-primary">
        <span class="weather-icon" id="today-icon">🌤️</span>
        <span class="temp" id="today-temp">—°</span>
        <span class="range" id="today-range"></span>
      </div>

      <div class="weather-meta">
        💦 <span id="today-humidity">—</span>%
        &nbsp;|&nbsp;
        🌧 <span id="today-rain">—</span>%
      </div>
    </div>

    <div class="weather">
      <div class="label">Tomorrow</div>

      <div class="weather-primary">
        <span class="weather-icon" id="tomorrow-icon">🌤️</span>
        <span class="temp" id="tomorrow-temp">—°</span>
        <span class="range" id="tomorrow-range"></span>
      </div>

      <div class="weather-meta">
        💦 <span id="tomorrow-humidity">—</span>%
        &nbsp;|&nbsp;
        🌧 <span id="tomorrow-rain">—</span>%
      </div>
    </div>

  </div>

  <div class="divider"></div>

  <div class="label calendar-label">Today</div>

  <!-- Temporary calendar placeholder.
       This is the bit we'll connect to Calendar Mirror next. -->
  <div class="events" id="events">
    <div class="empty">Calendar loading soon…</div>
  </div>

  <div class="divider"></div>

  <div class="exams">

    <div class="exam">
      <span class="exam-name">🏥 NSN911</span>
      <span class="countdown" id="nsn911"></span>
    </div>

    <div class="exam">
      <span class="exam-name">⚖️ LWS101</span>
      <span class="countdown" id="lws101"></span>
    </div>

  </div>

</div>

<script>
const TZ = "Australia/Brisbane";

/* ───── DATE ───── */

function updateDate() {
  document.getElementById("date").textContent =
    new Intl.DateTimeFormat("en-US", {
      timeZone: TZ,
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());
}

/* ───── EXAMS ───── */

function brisbaneDateString() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date());

  const get = type =>
    parts.find(part => part.type === type).value;

  return `${get("year")}-${get("month")}-${get("day")}`;
}

function daysUntil(dateString) {
  const today = new Date(
    brisbaneDateString() + "T00:00:00+10:00"
  );

  const target = new Date(
    dateString + "T00:00:00+10:00"
  );

  return Math.round((target - today) / 86400000);
}

function countdownText(days) {
  if (days === 0) return "today";
  if (days === 1) return "tomorrow";
  if (days < 0) return "complete";
  return `${days} days`;
}

function updateCountdowns() {
  document.getElementById("nsn911").textContent =
    countdownText(daysUntil("2026-11-04"));

  document.getElementById("lws101").textContent =
    countdownText(daysUntil("2026-11-06"));
}

/* ───── WEATHER ───── */

const weatherIcons = {
  0: "☀️",
  1: "🌤️",
  2: "⛅",
  3: "☁️",
  45: "🌫️",
  48: "🌫️",
  51: "🌦️",
  53: "🌦️",
  55: "🌧️",
  61: "🌦️",
  63: "🌧️",
  65: "🌧️",
  80: "🌦️",
  81: "🌧️",
  82: "🌧️",
  95: "⛈️",
  96: "⛈️",
  99: "⛈️"
};

function icon(code) {
  return weatherIcons[code] || "🌤️";
}

async function loadWeather() {

  try {

    /* Kensington Grove, Queensland */
    const latitude = -27.54;
    const longitude = 152.47;

    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${latitude}` +
      `&longitude=${longitude}` +
      `&current=temperature_2m,relative_humidity_2m,weather_code` +
      `&hourly=relative_humidity_2m` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max` +
      `&timezone=Australia%2FBrisbane` +
      `&forecast_days=2`;

    const response = await fetch(url);

    if (!response.ok)
      throw new Error("Weather unavailable");

    const data = await response.json();

    /* TODAY */

    document.getElementById("today-icon").textContent =
      icon(data.current.weather_code);

    document.getElementById("today-temp").textContent =
      `${Math.round(data.current.temperature_2m)}°`;

    document.getElementById("today-range").textContent =
      `${Math.round(data.daily.temperature_2m_min[0])}–` +
      `${Math.round(data.daily.temperature_2m_max[0])}°`;

    document.getElementById("today-humidity").textContent =
      Math.round(data.current.relative_humidity_2m);

    document.getElementById("today-rain").textContent =
      data.daily.precipitation_probability_max[0];


    /* TOMORROW */

    document.getElementById("tomorrow-icon").textContent =
      icon(data.daily.weather_code[1]);

    document.getElementById("tomorrow-temp").textContent =
      `${Math.round(data.daily.temperature_2m_max[1])}°`;

    document.getElementById("tomorrow-range").textContent =
      `${Math.round(data.daily.temperature_2m_min[1])}–` +
      `${Math.round(data.daily.temperature_2m_max[1])}°`;

    document.getElementById("tomorrow-rain").textContent =
      data.daily.precipitation_probability_max[1];


    /* Average daytime humidity tomorrow: 06:00–18:00 */

    const tomorrowDate = data.daily.time[1];

    const humidityValues = data.hourly.time
      .map((time, i) => ({
        time,
        humidity: data.hourly.relative_humidity_2m[i]
      }))
      .filter(item => {
        if (!item.time.startsWith(tomorrowDate))
          return false;

        const hour = Number(item.time.slice(11, 13));
        return hour >= 6 && hour < 18;
      })
      .map(item => item.humidity)
      .filter(value => value != null);

    const averageHumidity =
      humidityValues.reduce((a, b) => a + b, 0) /
      humidityValues.length;

    document.getElementById("tomorrow-humidity").textContent =
      Math.round(averageHumidity);

  } catch (error) {
    console.error(error);
  }
}

/* ───── RUN ───── */

updateDate();
updateCountdowns();
loadWeather();

setInterval(loadWeather, 30 * 60 * 1000);

</script>

</body>
</html>
