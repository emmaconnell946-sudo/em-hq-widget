<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --claret: #692337;
      --cream: #FFB9B9;
      --muted: #e8d4c6;
      --line: rgba(248, 239, 226, 0.20);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--cream);
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
    }

    .widget {
      width: 100%;
      background: var(--claret);
      border-radius: 14px;
      padding: 22px 28px 18px;
    }

    /* TOP ROW */

    .top {
      display: grid;
      grid-template-columns: minmax(300px, 1.5fr) 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .date {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(32px, 3vw, 50px);
      line-height: 1.05;
      letter-spacing: -0.025em;
    }

    .weather-label,
    .section-label {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .weather-main {
      display: flex;
      align-items: baseline;
      gap: 9px;
    }

    .weather-temp {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      font-weight: 400;
    }

    .weather-range {
      font-size: 13px;
      color: var(--muted);
    }

    .weather-meta {
      margin-top: 5px;
      font-size: 13px;
      color: var(--muted);
    }

    /* LOWER AREA */

    .lower {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 34px;
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      font-weight: 400;
    }

    /* CALENDAR */

    .calendar-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .calendar-event {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
      min-height: 22px;
    }

    .event-time {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
    }

    .event-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 400;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .all-day .event-title {
      grid-column: 1 / -1;
    }

    .calendar-empty,
    .calendar-error {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 400;
      font-style: italic;
      color: var(--muted);
    }

    .more-events {
      margin-top: 2px;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
    }

    /* EXAMS */

    .exams {
      padding-left: 4px;
    }

    .exam {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: baseline;
      padding: 3px 0 8px;
    }

    .exam-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      font-weight: 400;
    }

    .exam-days {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
    }

    /* RESPONSIVE */

    @media (max-width: 650px) {
      .widget {
        padding: 18px;
      }

      .top {
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .date {
        grid-column: 1 / -1;
      }

      .lower {
        grid-template-columns: 1fr;
      }

      .calendar-event {
        grid-template-columns: 110px minmax(0, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="widget">

    <div class="top">
      <div class="date" id="date"></div>

      <div>
        <div class="weather-label">Today</div>
        <div class="weather-main">
          <span id="today-icon"></span>
          <span class="weather-temp" id="today-temp">—</span>
          <span class="weather-range" id="today-range"></span>
        </div>
        <div class="weather-meta" id="today-meta"></div>
      </div>

      <div>
        <div class="weather-label">Tomorrow</div>
        <div class="weather-main">
          <span id="tomorrow-icon"></span>
          <span class="weather-temp" id="tomorrow-temp">—</span>
          <span class="weather-range" id="tomorrow-range"></span>
        </div>
        <div class="weather-meta" id="tomorrow-meta"></div>
      </div>
    </div>

    <div class="lower">

      <div class="calendar">
        <div class="section-label">Today</div>
        <div class="calendar-list" id="calendar">
          <div class="calendar-empty">Loading calendar…</div>
        </div>
      </div>

      <div class="exams">
        <div class="exam">
          <div class="exam-name">🏥 NSN911</div>
          <div class="exam-days" id="nsn911-days"></div>
        </div>

        <div class="exam">
          <div class="exam-name">⚖️ LWS101</div>
          <div class="exam-days" id="lws101-days"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const TIMEZONE = "Australia/Brisbane";

    /* DATE */

    function updateDate() {
      const now = new Date();

      document.getElementById("date").textContent =
        new Intl.DateTimeFormat("en-US", {
          timeZone: TIMEZONE,
          weekday: "long",
          month: "long",
          day: "numeric"
        }).format(now);
    }

    updateDate();

    /* WEATHER */

    function weatherIcon(code) {
      if (code === 0) return "☀️";
      if ([1, 2].includes(code)) return "🌤️";
      if (code === 3) return "☁️";
      if ([45, 48].includes(code)) return "🌫️";
      if ([51, 53, 55, 56, 57].includes(code)) return "🌦️";
      if ([61, 63, 65, 66, 67].includes(code)) return "🌧️";
      if ([71, 73, 75, 77].includes(code)) return "🌨️";
      if ([80, 81, 82].includes(code)) return "🌦️";
      if ([85, 86].includes(code)) return "🌨️";
      if ([95, 96, 99].includes(code)) return "⛈️";
      return "☁️";
    }

    async function loadWeather() {
      try {
        const url =
          "https://api.open-meteo.com/v1/forecast" +
          "?latitude=-27.54" +
          "&longitude=152.47" +
          "&current=temperature_2m,relative_humidity_2m,weather_code" +
          "&hourly=relative_humidity_2m" +
          "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
          "&timezone=Australia%2FBrisbane" +
          "&forecast_days=2";

        const response = await fetch(url);
        const data = await response.json();

        const current = data.current;
        const daily = data.daily;

        document.getElementById("today-icon").textContent =
          weatherIcon(current.weather_code);

        document.getElementById("today-temp").textContent =
          `${Math.round(current.temperature_2m)}°`;

        document.getElementById("today-range").textContent =
          `${Math.round(daily.temperature_2m_min[0])}–${Math.round(daily.temperature_2m_max[0])}°`;

        document.getElementById("today-meta").textContent =
          `💦 ${Math.round(current.relative_humidity_2m)}%  |  🌧 ${Math.round(daily.precipitation_probability_max[0])}%`;

        document.getElementById("tomorrow-icon").textContent =
          weatherIcon(daily.weather_code[1]);

        document.getElementById("tomorrow-temp").textContent =
          `${Math.round(daily.temperature_2m_max[1])}°`;

        document.getElementById("tomorrow-range").textContent =
          `${Math.round(daily.temperature_2m_min[1])}–${Math.round(daily.temperature_2m_max[1])}°`;

        const tomorrowDate = daily.time[1];

        const tomorrowHumidity = data.hourly.time
          .map((time, index) => ({
            time,
            humidity: data.hourly.relative_humidity_2m[index]
          }))
          .filter(item =>
            item.time.startsWith(tomorrowDate) &&
            Number(item.time.slice(11, 13)) >= 6 &&
            Number(item.time.slice(11, 13)) < 18
          )
          .map(item => item.humidity);

        const averageHumidity = tomorrowHumidity.length
          ? Math.round(
              tomorrowHumidity.reduce((a, b) => a + b, 0) /
              tomorrowHumidity.length
            )
          : "—";

        document.getElementById("tomorrow-meta").textContent =
          `💦 ${averageHumidity}%  |  🌧 ${Math.round(daily.precipitation_probability_max[1])}%`;

      } catch (error) {
        console.error("Weather failed:", error);
      }
    }

    loadWeather();
    setInterval(loadWeather, 30 * 60 * 1000);

    /* LIVE CALENDAR */

    async function loadCalendar() {
      const calendar = document.getElementById("calendar");

      try {
        const response = await fetch(
          `calendar.json?v=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Calendar feed unavailable");
        }

        const events = await response.json();

        calendar.innerHTML = "";

        if (!events.length) {
          calendar.innerHTML =
            '<div class="calendar-empty">Nothing on today.</div>';
          return;
        }

        const visibleEvents = events.slice(0, 5);

        visibleEvents.forEach(event => {
          const row = document.createElement("div");

          if (event.all_day || !event.time) {
            row.className = "calendar-event all-day";

            const title = document.createElement("div");
            title.className = "event-title";
            title.textContent = event.title;

            row.appendChild(title);
          } else {
            row.className = "calendar-event";

            const time = document.createElement("div");
            time.className = "event-time";
            time.textContent = event.time;

            const title = document.createElement("div");
            title.className = "event-title";
            title.textContent = event.title;

            row.appendChild(time);
            row.appendChild(title);
          }

          calendar.appendChild(row);
        });

        if (events.length > 5) {
          const more = document.createElement("div");
          more.className = "more-events";
          more.textContent = `+ ${events.length - 5} more`;
          calendar.appendChild(more);
        }

      } catch (error) {
        console.error("Calendar failed:", error);

        calendar.innerHTML =
          '<div class="calendar-error">Calendar unavailable.</div>';
      }
    }

    loadCalendar();
    setInterval(loadCalendar, 5 * 60 * 1000);

    /* EXAM COUNTDOWNS */

    function brisbaneDateParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(date);

      const values = {};

      parts.forEach(part => {
        if (part.type !== "literal") {
          values[part.type] = Number(part.value);
        }
      });

      return values;
    }

    function daysUntil(year, month, day) {
      const today = brisbaneDateParts();

      const todayUTC = Date.UTC(
        today.year,
        today.month - 1,
        today.day
      );

      const targetUTC = Date.UTC(
        year,
        month - 1,
        day
      );

      return Math.ceil(
        (targetUTC - todayUTC) / 86400000
      );
    }

    function updateExams() {
      document.getElementById("nsn911-days").textContent =
        `${daysUntil(2026, 11, 4)} days`;

      document.getElementById("lws101-days").textContent =
        `${daysUntil(2026, 11, 6)} days`;
    }

    updateExams();
  </script>
</body>
</html>
