<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Em HQ — Dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF643C;--ecru:#FFF0E6;--pink:#FFB9B9;--plum:#692337;--white:#fffaf6;--line:rgba(105,35,55,.15)}
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--plum)}body{font-family:"DM Sans",sans-serif}
.widget{width:100%;min-height:310px;background:var(--ecru);border-radius:22px;overflow:hidden;position:relative;padding:24px;box-shadow:0 10px 30px rgba(105,35,55,.08)}
.widget:before,.widget:after{content:"";position:absolute;border-radius:999px;pointer-events:none}.widget:before{width:210px;height:210px;background:var(--pink);right:-90px;top:-120px;opacity:.55}.widget:after{width:170px;height:170px;background:var(--orange);left:-100px;bottom:-115px;opacity:.9}
.grid{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:16px}
.card{min-width:0;border:1px solid var(--line);border-radius:18px;padding:20px;background:rgba(255,250,246,.72);backdrop-filter:blur(3px)}
.dinner{background:var(--plum);color:var(--ecru);border:0}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}.dinner .eyebrow{color:var(--pink)}
h1,h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;margin:0}h1{font-size:clamp(28px,3.2vw,46px);line-height:1.02}h2{font-size:25px;line-height:1.05}
.date{margin-top:8px;font-size:13px;color:rgba(255,240,230,.72)}.badge{display:inline-flex;margin-top:20px;padding:7px 10px;border-radius:999px;background:var(--pink);color:var(--plum);font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column;gap:9px;margin-top:16px}.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}
.check{width:19px;height:19px;border:1.5px solid var(--plum);border-radius:6px;background:transparent;cursor:pointer;margin-top:1px}.check:hover{background:var(--pink)}.check:disabled{opacity:.45;cursor:wait}
.task-name{font-size:14px;line-height:1.25}.for{font-size:11px;margin-top:3px;opacity:.65}.empty{font-family:"DM Serif Display",Georgia,serif;font-size:17px;opacity:.6;margin-top:18px}
.future .eyebrow{color:var(--orange)}.today .eyebrow{color:var(--plum)}.day-group{margin-top:15px}.day{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--orange)}
.status{position:relative;z-index:1;text-align:right;margin-top:12px;font-size:10px;opacity:.45}
@media(max-width:700px){.widget{padding:14px}.grid{grid-template-columns:1fr}.card{padding:17px}}
</style>
</head>
<body>
<div class="widget">
  <div class="grid">
    <section class="card dinner">
      <div class="eyebrow">Dinner tonight</div>
      <h1 id="meal">Loading…</h1>
      <div class="date" id="date"></div>
      <div class="badge" id="kids" hidden>Kids tonight</div>
    </section>
    <section class="card today">
      <div class="eyebrow">Today</div>
      <h2>Prep for tonight</h2>
      <div class="list" id="today-list"><div class="empty">Loading…</div></div>
    </section>
    <section class="card future">
      <div class="eyebrow">Prep ahead</div>
      <h2>Future dinners</h2>
      <div id="future-list"><div class="empty">Loading…</div></div>
    </section>
  </div>
  <div class="status" id="status"></div>
</div>
<script>
const TZ="Australia/Brisbane";
const DATA_URL="../meal.json";
const API_URL="https://hook.us2.make.com/7frgklrwcah8mcxm5mpwcg69llirnp87";
const COMPLETED_KEY="em-hq-meal-completed-v1";

const fmtDate=d=>new Intl.DateTimeFormat("en-AU",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"}).format(new Date(d+"T12:00:00+10:00"));
function todayKey(){
 const parts=new Intl.DateTimeFormat("en-AU",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
 const get=t=>parts.find(p=>p.type===t)?.value;
 return `${get("year")}-${get("month")}-${get("day")}`;
}
function completedIds(){
 try{return new Set(JSON.parse(localStorage.getItem(COMPLETED_KEY)||"[]"))}catch{return new Set()}
}
function rememberCompleted(id){
 const ids=completedIds();ids.add(id);localStorage.setItem(COMPLETED_KEY,JSON.stringify([...ids]));
}
function taskRow(t){
 const row=document.createElement("div"); row.className="task";
 const b=document.createElement("button"); b.className="check"; b.setAttribute("aria-label","Mark "+t.task+" done");
 const wrap=document.createElement("div"); const n=document.createElement("div"); n.className="task-name"; n.textContent=t.task; wrap.appendChild(n);
 if(t.targetDinner){const f=document.createElement("div");f.className="for";f.textContent="for "+t.targetDinner;wrap.appendChild(f)}
 b.onclick=()=>completeTask(t,row,b); row.append(b,wrap); return row;
}
async function completeTask(t,row,b){
 const status=document.getElementById("status");
 b.disabled=true; status.textContent="Updating…";
 try{
  const u=new URL(API_URL);u.searchParams.set("id",t.id);u.searchParams.set("done","true");
  await fetch(u.toString(),{method:"GET",mode:"no-cors",cache:"no-store"});
  rememberCompleted(t.id);
  row.remove();status.textContent="Prep task marked done.";
  setTimeout(load,150);
 }catch(e){
  b.disabled=false;status.textContent="Couldn't update prep task.";
 }
}
async function load(){
 try{
  const r=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"}); if(!r.ok)throw Error(); const cache=await r.json();
  const date=todayKey();
  const day=cache.days?.[date]||{};
  const dinner=day.dinner||null;
  const completed=completedIds();
  const due=(cache.prep||[]).filter(t=>t.doDate===date&&!t.done&&!completed.has(t.id));
  const todayPrep=due.filter(t=>t.targetDate===date);
  const advancePrep=due.filter(t=>t.targetDate>date);

  document.getElementById("date").textContent=fmtDate(date);
  document.getElementById("meal").textContent=dinner?.name||"Nothing planned";
  document.getElementById("kids").hidden=!dinner?.kidsTonight;

  const today=document.getElementById("today-list");today.innerHTML="";
  todayPrep.forEach(t=>today.appendChild(taskRow(t)));
  if(!todayPrep.length)today.innerHTML='<div class="empty">Nothing to prep — just cook.</div>';

  const future=document.getElementById("future-list");future.innerHTML="";
  const groups={};advancePrep.forEach(t=>(groups[t.targetDate]??=[]).push(t));
  Object.keys(groups).sort().forEach(targetDate=>{
   const g=document.createElement("div");g.className="day-group";
   const lab=document.createElement("div");lab.className="day";lab.textContent=fmtDate(targetDate);
   const list=document.createElement("div");list.className="list";
   groups[targetDate].forEach(t=>list.appendChild(taskRow(t)));
   g.append(lab,list);future.appendChild(g);
  });
  if(!advancePrep.length)future.innerHTML='<div class="empty">Nothing needed today.</div>';
  document.getElementById("status").textContent="";
 }catch(e){
  document.getElementById("meal").textContent="Dinner unavailable";
  document.getElementById("today-list").innerHTML='<div class="empty">Prep unavailable.</div>';
  document.getElementById("future-list").innerHTML='<div class="empty">Prep unavailable.</div>';
 }
}
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
