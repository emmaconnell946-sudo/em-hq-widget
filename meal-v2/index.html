<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Em HQ — Meal Planner v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#692337;
  --plum-2:#7a2d44;
  --pink:#ffb9b9;
  --soft-pink:#ffd1cd;
  --ecru:#fff0e6;
  --cream:#fffaf6;
  --orange:#ff643c;
  --ink:#5b1d31;
  --line:rgba(105,35,55,.14);
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink)}
body{font-family:"DM Sans",system-ui,sans-serif}
.shell{
  width:100%;
  background:var(--ecru);
  border-radius:24px;
  overflow:hidden;
  position:relative;
  padding:18px;
  box-shadow:0 10px 28px rgba(105,35,55,.08);
}
.shell:before,.shell:after{
  content:"";
  position:absolute;
  border-radius:999px;
  pointer-events:none;
}
.shell:before{
  width:230px;height:230px;right:-110px;top:-145px;
  background:var(--pink);opacity:.55;
}
.shell:after{
  width:170px;height:170px;left:-100px;bottom:-115px;
  background:var(--orange);opacity:.9;
}
.stack{position:relative;z-index:1;display:grid;gap:14px}
.hero{
  border-radius:22px;
  padding:22px;
  background:var(--plum);
  color:var(--ecru);
  min-height:170px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.eyebrow{
  font-size:11px;
  font-weight:700;
  letter-spacing:.17em;
  text-transform:uppercase;
}
.hero .eyebrow{color:var(--pink)}
.hero h1,.panel h2{
  font-family:"DM Serif Display",Georgia,serif;
  font-weight:400;
  margin:0;
}
.hero h1{
  font-size:clamp(34px,6vw,52px);
  line-height:1.02;
  margin-top:14px;
}
.hero-meta{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  margin-top:18px;
}
.date{font-size:14px;color:rgba(255,240,230,.72)}
.badge{
  background:var(--pink);
  color:var(--plum);
  padding:8px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{
  background:rgba(255,250,246,.8);
  border:1px solid var(--line);
  border-radius:20px;
  padding:18px;
}
.panel h2{font-size:26px;line-height:1.05;margin-top:7px}
.panel-ahead .eyebrow{color:var(--orange)}
.list{display:grid;gap:8px;margin-top:14px}
.item{
  border-top:1px solid var(--line);
  padding-top:10px;
}
.item:first-child{border-top:0;padding-top:0}
.task{font-size:14px;line-height:1.3;font-weight:600}
.for{font-size:11px;opacity:.62;margin-top:3px}
.day{
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.11em;
  color:var(--orange);
  margin-top:13px;
}
.empty{
  font-family:"DM Serif Display",Georgia,serif;
  font-size:18px;
  opacity:.58;
  margin-top:16px;
}
.error{color:var(--orange);opacity:1}
.footer{
  position:relative;
  z-index:1;
  min-height:14px;
  text-align:right;
  font-size:10px;
  opacity:.45;
  margin-top:10px;
}
.footer.warn{opacity:1;color:var(--orange);font-weight:700}
@media(max-width:680px){
  .shell{padding:12px;border-radius:20px}
  .hero{padding:20px;min-height:185px}
  .hero h1{font-size:38px}
  .panels{grid-template-columns:1fr}
  .panel{padding:17px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="stack">
    <section class="hero">
      <div>
        <div class="eyebrow">Dinner tonight</div>
        <h1 id="meal">Loading…</h1>
      </div>
      <div class="hero-meta">
        <div class="date" id="date"></div>
        <div class="badge" id="kids" hidden>Kids tonight</div>
      </div>
    </section>

    <div class="panels">
      <section class="panel">
        <div class="eyebrow">Today</div>
        <h2>Prep for tonight</h2>
        <div class="list" id="tonight"><div class="empty">Loading…</div></div>
      </section>

      <section class="panel panel-ahead">
        <div class="eyebrow">Prep ahead</div>
        <h2>Future dinners</h2>
        <div id="ahead"><div class="empty">Loading…</div></div>
      </section>
    </div>
  </div>
  <div class="footer" id="status"></div>
</div>

<script>
const TZ="Australia/Brisbane";
const DATA_URL="../meal-v2.json";

function brisbaneDateKey(){
  const p=new Intl.DateTimeFormat("en-AU",{
    timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(new Date());
  const v=t=>p.find(x=>x.type===t)?.value;
  return v("year")+"-"+v("month")+"-"+v("day");
}

function prettyDate(iso){
  return new Intl.DateTimeFormat("en-AU",{
    timeZone:TZ,weekday:"long",day:"numeric",month:"long"
  }).format(new Date(iso+"T12:00:00+10:00"));
}

function createTask(t){
  const row=document.createElement("div");
  row.className="item";

  const name=document.createElement("div");
  name.className="task";
  name.textContent=t.task;
  row.appendChild(name);

  if(t.targetDinner){
    const sub=document.createElement("div");
    sub.className="for";
    sub.textContent="for "+t.targetDinner;
    row.appendChild(sub);
  }
  return row;
}

function ageMinutes(iso){
  const n=new Date(iso).getTime();
  return Number.isFinite(n)?Math.round((Date.now()-n)/60000):999999;
}

async function load(){
  const today=brisbaneDateKey();
  document.getElementById("date").textContent=prettyDate(today);

  try{
    const response=await fetch(DATA_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);

    const data=await response.json();
    if(!data.generatedAt || !data.days || !Array.isArray(data.prep)){
      throw new Error("Invalid feed");
    }

    const stale=ageMinutes(data.generatedAt)>120;
    const day=data.days[today];
    const dinners=day?.dinners||[];

    const meal=document.getElementById("meal");
    const kids=document.getElementById("kids");

    if(dinners.length){
      meal.textContent=dinners.map(d=>d.name).join(" + ");
      kids.hidden=!dinners.some(d=>d.kidsTonight);
    }else{
      meal.textContent="Nothing planned";
      kids.hidden=true;
    }

    const due=data.prep.filter(t=>t.doDate===today && !t.done);
    const tonight=due.filter(t=>t.targetDate===today);
    const ahead=due.filter(t=>t.targetDate && t.targetDate>today);

    const tonightEl=document.getElementById("tonight");
    tonightEl.innerHTML="";
    tonight.forEach(t=>tonightEl.appendChild(createTask(t)));
    if(!tonight.length){
      tonightEl.innerHTML='<div class="empty">Nothing to prep — just cook.</div>';
    }

    const aheadEl=document.getElementById("ahead");
    aheadEl.innerHTML="";
    const grouped={};
    ahead.forEach(t=>(grouped[t.targetDate]??=[]).push(t));

    Object.keys(grouped).sort().forEach(date=>{
      const label=document.createElement("div");
      label.className="day";
      label.textContent=prettyDate(date);
      aheadEl.appendChild(label);

      const list=document.createElement("div");
      list.className="list";
      grouped[date].forEach(t=>list.appendChild(createTask(t)));
      aheadEl.appendChild(list);
    });

    if(!ahead.length){
      aheadEl.innerHTML='<div class="empty">Nothing needed today.</div>';
    }

    const status=document.getElementById("status");
    const synced=new Date(data.generatedAt).toLocaleTimeString("en-AU",{
      timeZone:TZ,hour:"numeric",minute:"2-digit"
    });

    if(stale){
      status.className="footer warn";
      status.textContent="Meal feed is stale · last sync "+synced;
    }else{
      status.className="footer";
      status.textContent="Synced "+synced;
    }
  }catch(err){
    document.getElementById("meal").textContent="Couldn’t load meal plan";
    document.getElementById("kids").hidden=true;
    document.getElementById("tonight").innerHTML='<div class="empty error">Meal data unavailable — not an empty plan.</div>';
    document.getElementById("ahead").innerHTML='<div class="empty error">Prep data unavailable.</div>';
    const status=document.getElementById("status");
    status.className="footer warn";
    status.textContent="Data error";
  }
}

load();
setInterval(load,5*60*1000);
</script>
</body>
</html>
