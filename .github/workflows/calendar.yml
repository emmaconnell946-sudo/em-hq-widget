name: Update Today Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out widget
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create calendar feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["NOTION_TOKEN"]
          data_source_id = os.environ["NOTION_DATA_SOURCE_ID"]

          url = f"https://api.notion.com/v1/data_sources/{data_source_id}/query"

          request = urllib.request.Request(
              url,
              data=json.dumps({"page_size": 100}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Notion-Version": "2025-09-03",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          events = []

          def formula_text(prop):
              formula = prop.get("formula", {})
              return formula.get("string") or ""

          def title_text(prop):
              parts = prop.get("title", [])
              return "".join(
                  part.get("plain_text", "")
                  for part in parts
              ).strip()

          for page in data.get("results", []):
              props = page.get("properties", {})

              # Calendar Mirror already determines whether
              # this event belongs on today's dashboard.
              if formula_text(props.get("Show today", {})) != "Today":
                  continue

              title = title_text(props.get("Event", {}))

              if not title:
                  continue

              all_day = props.get("All day", {}).get("checkbox", False)

              if all_day:
                  display_time = ""
              else:
                  display_time = formula_text(props.get("Time", {}))

              events.append({
                  "time": display_time,
                  "title": title,
                  "all_day": all_day,
              })

          # All-day events first.
          # Timed events then follow in chronological order.
          def sort_key(event):
              if event["all_day"]:
                  return (0, "")

              time = event["time"].strip()

              try:
                  start_time = time.split("–")[0].strip()
                  from datetime import datetime
                  parsed = datetime.strptime(start_time, "%I:%M %p")
                  return (1, parsed.strftime("%H:%M"))
              except Exception:
                  return (1, time)

          events.sort(key=sort_key)

          with open("calendar.json", "w") as file:
              json.dump(
                  events,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Today's calendar:")
          print(json.dumps(events, indent=2))
          PY

      - name: Publish calendar feed
        run: |
          git config user.name "Em HQ Calendar Bot"
          git config user.email "actions@github.com"

          git add calendar.json

          if git diff --cached --quiet; then
            echo "Calendar already up to date."
            exit 0
          fi

          git commit -m "Update Today calendar"
          git push
