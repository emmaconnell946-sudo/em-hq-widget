name: Update Today Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Check out widget
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create calendar feed
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          token = os.environ["NOTION_TOKEN"]
          data_source_id = os.environ["NOTION_DATA_SOURCE_ID"]

          BRISBANE = ZoneInfo("Australia/Brisbane")
          today = datetime.now(BRISBANE).date()

          url = f"https://api.notion.com/v1/data_sources/{data_source_id}/query"

          request = urllib.request.Request(
              url,
              data=json.dumps({"page_size": 100}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Notion-Version": "2025-09-03",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          events = []

          def title_text(prop):
              parts = prop.get("title", [])
              return "".join(
                  part.get("plain_text", "")
                  for part in parts
              ).strip()

          def parse_datetime(value):
              if not value:
                  return None

              dt = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=BRISBANE)

              return dt.astimezone(BRISBANE)

          def display_time(dt):
              if not dt:
                  return ""

              return dt.strftime("%I:%M %p").lstrip("0")

          for page in data.get("results", []):
              props = page.get("properties", {})

              title = title_text(
                  props.get("Event", {})
              )

              if not title:
                  continue

              all_day = props.get(
                  "All day", {}
              ).get("checkbox", False)

              when = props.get(
                  "When", {}
              ).get("date") or {}

              start_raw = when.get("start")
              end_raw = when.get("end")

              if not start_raw:
                  continue

              # ALL-DAY EVENTS
              if all_day:
                  start_date = datetime.fromisoformat(
                      start_raw[:10]
                  ).date()

                  if end_raw:
                      end_date = datetime.fromisoformat(
                          end_raw[:10]
                      ).date()
                  else:
                      end_date = start_date

                  # Google/Notion all-day end dates are exclusive.
                  occurs_today = (
                      start_date <= today < end_date
                      if end_raw
                      else start_date == today
                  )

                  if not occurs_today:
                      continue

                  events.append({
                      "time": "",
                      "title": title,
                      "all_day": True,
                      "sort": "0000",
                  })

                  continue

              # TIMED EVENTS
              start = parse_datetime(start_raw)
              end = parse_datetime(end_raw)

              if not start:
                  continue

              # Include anything that overlaps today in Brisbane.
              if end:
                  occurs_today = (
                      start.date() <= today <= end.date()
                  )
              else:
                  occurs_today = start.date() == today

              if not occurs_today:
                  continue

              start_text = display_time(start)
              end_text = display_time(end)

              if start_text and end_text:
                  time_text = (
                      f"{start_text} – {end_text}"
                  )
              else:
                  time_text = start_text

              events.append({
                  "time": time_text,
                  "title": title,
                  "all_day": False,
                  "sort": start.strftime("%H%M"),
              })

          events.sort(
              key=lambda event: (
                  0 if event["all_day"] else 1,
                  event["sort"]
              )
          )

          # Don't expose the internal sort value
          # in calendar.json.
          for event in events:
              event.pop("sort", None)

          with open("calendar.json", "w") as file:
              json.dump(
                  events,
                  file,
                  ensure_ascii=False,
                  indent=2
              )

          print("Brisbane date:", today)
          print("Today's calendar:")
          print(
              json.dumps(
                  events,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Publish calendar feed
        run: |
          git config user.name "Em HQ Calendar Bot"
          git config user.email "actions@github.com"

          git add calendar.json

          if git diff --cached --quiet; then
            echo "Calendar already up to date."
            exit 0
          fi

          git commit -m "Update Today calendar"
          git push
